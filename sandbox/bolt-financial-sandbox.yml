test_cards:
  matching_rule: The full card number must match for post-authorization processes. Only the
    last 4 digits are used in pre-authorization rejections. Any card that ends in 0001 is
    rejected in pre-authorization.
  generic:
    expiration: any month/year in the future
    cvv: any 3 digits
    type: Visa
    cards:
    - scenario: Pre-auth irreversibly rejected
      number: '4100200300030001'
      behavior: Shopper receives an error and does not proceed to order confirmation. No
        authorization call made. Not available for re-review or force approval.
    - scenario: Approved
      number: '4111111111111111'
      behavior: Payment is accepted.
    - scenario: Declined
      number: '4111111111111012'
      behavior: Payment is declined by payment processor.
  by_processor:
  - processor: Bolt Payments
    expiration: 03/30
    cvv: '737'
    type: Visa
    note: Merchants who onboarded with Bolt Payments after 2022-11-01 should use the
      alternate numbers.
    cards:
    - scenario: Pre-auth irreversibly rejected
      number: '4100200300030001'
      alternate: '4100200300110001'
    - scenario: Review
      number: '4457000200000008'
      alternate: '4400000000000008'
    - scenario: Approved
      number: '4111111111111111'
      alternate: '4111111111111111'
    - scenario: Reviewed and reversibly rejected
      number: '4457010200000247'
      alternate: '4646464646464644'
    - scenario: Reviewed and irreversibly rejected
      number: '4457010140000141'
      alternate: '4457010140000141'
  - processor: Stripe
    cards:
    - scenario: Pre-auth irreversibly rejected
      number: '4100200310000001'
    - scenario: Review
      number: '4000004840000008'
    - scenario: Approved
      number: '4111111111111111'
    - scenario: Reviewed and reversibly rejected
      number: '5200828282828210'
    - scenario: Reviewed and irreversibly rejected
      number: '4457010140000141'
  third_party_note: Bolt links to Adyen, Authorize.net, Braintree, CardConnect, Checkout.com,
    CyberSource, NMI, PayPal, Payflow Pro, Radial and Stripe test-card references but does
    not guarantee third-party test cards.

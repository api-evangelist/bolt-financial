decline_codes:
  published: false
  docs: https://help.boltapp.com/developers/payment-authorization/authorization-codes/
  note: Bolt does not publish its own decline / authorization response code list. Its
    Authorization Response Codes page directs merchants to the code reference of whichever
    processor or gateway is configured (Adyen, Braintree, CyberSource, NMI, PayPal) and
    tells Bolt Payments merchants to contact their customer success manager. No
    errors/bolt-financial-decline-codes.yml artifact was written because there is nothing
    published to capture.

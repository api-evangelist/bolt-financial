notes:
- The boltcheckout MCP server is a Speakeasy projection of the Bolt API v1 spec only. Every
  bound tool inherits its real inputSchema from that operation's parameters and requestBody.
- authorizeTransaction, the operation that actually moves money, is deliberately or
  incidentally absent from the tool set; refund, capture, void and review are all present.
- The hosted documentation MCP server and the API MCP server are distinct products with no
  overlapping tools.

servers:
- name: bolt-docs
  kind: documentation
  status: advertised
  transport: http
  url: https://help.boltapp.com/mcp
  discovery: https://help.boltapp.com/.well-known/mcp
  install: npx add-mcp https://help.boltapp.com/mcp
  clients:
  - client: Claude Code
    command: claude mcp add --transport http bolt-docs https://help.boltapp.com/mcp
  - client: Cursor
    config: '{"mcpServers":{"bolt-docs":{"url":"https://help.boltapp.com/mcp"}}}'
  - client: VS Code
    config: '{"servers":{"bolt-docs":{"type":"http","url":"https://help.boltapp.com/mcp"}}}'
  tools:
  - name: search_docs
    description: Search titles and content; returns ranked snippets.
  - name: get_doc_page
    description: Full page markdown by path (e.g. /getting-started/api-keys).
  - name: list_doc_sections
    description: Documentation sections from navigation.
  probe:
    url: https://help.boltapp.com/mcp
    method: POST tools/list
    http_status: 404
    observed: '2026-07-31'
    note: The documented endpoint 308-redirects to /mcp/ which is served by the legacy Hugo
      docs origin and returns an HTML 404. The server is documented by Bolt but did not
      answer an MCP tools/list call from this network at probe time. Tool names and
      descriptions above are transcribed from Bolt's own MCP server documentation page,
      not from a live tools/list response.

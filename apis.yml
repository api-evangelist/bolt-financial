  - type: Overlay
    url: overlays/bolt-financial-embeddable-checkout-v1-overlay.yaml
- aid: bolt-financial:embeddable-checkout-v3
  name: Bolt Embeddable Checkout v3 API
  description: 'The v3 generation of the Bolt Embeddable Checkout API, served under
    a /v3 path with a templated environment server variable. Reorganises the surface
    around Accounts, Payments (including guest payments), Orders, OAuth, merchant
    Callbacks, Testing and Events. Bolt gates v3 behind explicit enablement and directs
    most integrations to v1.'
  humanURL: https://help.boltapp.com/api-embedded-v3/
  baseURL: https://api.boltapp.com/v3
  tags:
  - Checkout
  - Payments
  - Order
  - Account
  tags_raw:

aid: bolt-financial
name: Bolt Financial
description: 'Bolt Financial, Inc. is an American commerce technology company that gives
  retailers a one-click, identity-powered checkout backed by a shopper account network,
  payments processing, tokenization and fraud protection. Merchants integrate Bolt either
  through platform plugins (Adobe Commerce/Magento, BigCommerce, Salesforce Commerce Cloud,
  Shopify, WooCommerce) or directly against a REST API surface that covers shopper accounts,
  order tokens, transaction authorize/capture/refund/void, subscriptions, product catalog,
  merchant statements, webhooks and a hosted card tokenizer. Bolt publishes OpenAPI 3.0
  definitions for its Bolt API, Embeddable Checkout v1 and v3, and Tokenizer endpoints,
  ships first-party SDKs for TypeScript, Python, C#, Go, PHP, iOS/Swift, Android/Kotlin,
  React Native, Unity and Unreal, and maintains an explicit agent-facing surface: an
  llms.txt index, a hosted documentation MCP server and two published agent skills.'

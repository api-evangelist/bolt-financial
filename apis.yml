  - Payments
  - Orders
  - Accounts
  properties:
  - type: OpenAPI
    url: openapi/bolt-financial-embeddable-checkout-v3-openapi.yml
  - type: Documentation
    url: https://help.boltapp.com/api-embedded-v3/
  - type: Overlay
    url: overlays/bolt-financial-embeddable-checkout-v3-overlay.yaml
- aid: bolt-financial:tokenizer
  name: Bolt Tokenizer API
  description: 'The Bolt Tokenizer endpoint, hosted on the separate bolttk.com domain
    so raw card data never touches the merchant server. Publishes an RSA public key
    for client-side encryption and exchanges an encrypted card payload for a Bolt
    payment token that can be used with the transaction APIs.'
  humanURL: https://help.boltapp.com/api-tokenizer/
  baseURL: https://production.bolttk.com
  tags:
  - Tokenization
  - Payments
  - Security
  properties:
  - type: OpenAPI
    url: openapi/bolt-financial-tokenizer-openapi.yml
  - type: Documentation
    url: https://help.boltapp.com/api-tokenizer/
  - type: Overlay
    url: overlays/bolt-financial-tokenizer-overlay.yaml
- aid: bolt-financial:mcp
  name: Bolt MCP Servers
  description: 'Bolt exposes two Model Context Protocol surfaces: a hosted documentation
    MCP server advertised at help.boltapp.com/mcp with search_docs, get_doc_page and
    list_doc_sections tools, and a Speakeasy-generated API MCP server (boltcheckout)
    published as source in the BoltApp GitHub organization with 22 tools bound to
    Bolt API operations.'
  humanURL: https://help.boltapp.com/ai-agents/mcp-server
  baseURL: https://help.boltapp.com/mcp
  tags:

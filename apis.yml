apis:
- aid: bolt-financial:bolt-api
  name: Bolt API
  description: 'The core Bolt merchant API. Covers Bolt shopper accounts (profile,
    addresses, payment methods), merchant configuration and callbacks, order token
    creation, shipment tracking, transaction authorize/capture/refund/review/void/update,
    subscriptions with dunning settings, merchant statements, sandbox testing helpers
    and webhook registration. Authenticated with an X-Api-Key header for server-side
    calls, or OAuth 2.0 authorization-code tokens for shopper-scoped account access.'
  humanURL: https://help.boltapp.com/api-bolt/
  baseURL: https://api.boltapp.com
  tags:

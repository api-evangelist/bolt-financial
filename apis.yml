- aid: bolt-financial:embeddable-checkout-v1
  name: Bolt Embeddable Checkout v1 API
  description: 'The Embeddable Checkout v1 API used by merchants building their own
    checkout UI on top of Bolt. Exposes shopper account lookup and management, address
    and payment-method operations, OAuth token exchange, transaction authorize/capture/refund/void,
    tokenizer proxying and sandbox testing helpers. Bolt documents v1 as the default
    for custom checkout UI.'
  humanURL: https://help.boltapp.com/api-embedded/
  baseURL: https://api.boltapp.com
